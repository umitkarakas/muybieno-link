<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--surface);padding:18px;}
  .row{display:flex;gap:0;border-radius:14px;overflow:hidden;box-shadow:var(--shadow-sm);}
  .sw{flex:1;height:96px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;}
  .n{font-size:11px;font-weight:700;}
  .h{font-size:10px;font-family:var(--font-mono);opacity:.85;}
</style></head><body>
  <div class="row">
    <div class="sw" style="background:#1B1C1A;color:#fff"><span class="n">900 · heading</span><span class="h">#1B1C1A</span></div>
    <div class="sw" style="background:#504442;color:#fff"><span class="n">700 · body</span><span class="h">#504442</span></div>
    <div class="sw" style="background:#655D5A;color:#fff"><span class="n">500 · muted</span><span class="h">#655D5A</span></div>
    <div class="sw" style="background:#827472;color:#fff"><span class="n">400 · outline</span><span class="h">#827472</span></div>
    <div class="sw" style="background:#A99A8C;color:#1B1C1A"><span class="n">300 · faint</span><span class="h">#A99A8C</span></div>
  </div>
</body></html>
