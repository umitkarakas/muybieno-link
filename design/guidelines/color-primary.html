<!-- @dsCard group="Colors" viewport="700x150" name="Primary — Espresso" subtitle="Brand ramp · CTAs, headers, dark surfaces" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--surface);padding:18px;}
  .row{display:flex;gap:0;border-radius:14px;overflow:hidden;box-shadow:var(--shadow-sm);}
  .sw{flex:1;height:96px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;color:var(--cream-100);}
  .n{font-size:11px;font-weight:700;letter-spacing:.02em;}
  .h{font-size:10px;font-family:var(--font-mono);opacity:.8;}
</style></head><body>
  <div class="row">
    <div class="sw" style="background:#1B0D0A"><span class="n">900</span><span class="h">#1B0D0A</span></div>
    <div class="sw" style="background:#271310"><span class="n">800</span><span class="h">#271310</span></div>
    <div class="sw" style="background:#3E2723"><span class="n">700 · primary</span><span class="h">#3E2723</span></div>
    <div class="sw" style="background:#5B403C"><span class="n">600</span><span class="h">#5B403C</span></div>
    <div class="sw" style="background:#6F4A2A"><span class="n">500</span><span class="h">#6F4A2A</span></div>
    <div class="sw" style="background:#8A6A3C"><span class="n">400</span><span class="h">#8A6A3C</span></div>
  </div>
</body></html>
