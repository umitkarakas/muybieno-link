<!-- @dsCard group="Colors" viewport="700x170" name="Surfaces & Cream" subtitle="Page / card / inset, and cream ink for dark espresso" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--surface);padding:18px;display:flex;gap:12px;flex-wrap:wrap;}
  .sw{width:150px;height:104px;border-radius:14px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-shadow:var(--shadow-sm);border:1px solid var(--line);}
  .n{font-size:11px;font-weight:700;}
  .h{font-size:10px;font-family:var(--font-mono);opacity:.85;}
</style></head><body>
  <div class="sw" style="background:#FBF9F5"><span class="n">surface</span><span class="h">#FBF9F5</span></div>
  <div class="sw" style="background:#FFFFFF"><span class="n">card</span><span class="h">#FFFFFF</span></div>
  <div class="sw" style="background:#F5F2ED"><span class="n">inset / latte</span><span class="h">#F5F2ED</span></div>
  <div class="sw" style="background:#1B1C1A;color:#FBF3E7;border:none"><span class="n">inverse</span><span class="h">#1B1C1A</span></div>
  <div class="sw" style="background:#3E2723;color:#FBF3E7;border:none"><span class="n">cream on espresso</span><span class="h">#FBF3E7 / #E8D5B5</span></div>
</body></html>
