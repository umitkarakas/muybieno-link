<!-- @dsCard group="Spacing" viewport="700x170" name="Elevation" subtitle="Warm primary-tinted shadows — never cool slate" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--surface);padding:26px;display:flex;gap:26px;align-items:center;}
  .b{background:var(--surface-card);border-radius:18px;width:150px;height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;}
  .n{font-size:12px;font-weight:700;color:var(--text-heading);}
  .h{font-size:10px;font-family:var(--font-mono);color:var(--text-muted);}
</style></head><body>
  <div class="b" style="box-shadow:var(--shadow-sm)"><span class="n">sm</span><span class="h">cards rest</span></div>
  <div class="b" style="box-shadow:var(--shadow-md)"><span class="n">md</span><span class="h">product cards</span></div>
  <div class="b" style="box-shadow:var(--shadow-lg)"><span class="n">lg</span><span class="h">hover lift</span></div>
  <div class="b" style="box-shadow:var(--shadow-cta)"><span class="n">cta</span><span class="h">primary buttons</span></div>
</body></html>
