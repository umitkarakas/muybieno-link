<!doctype html>
<!-- @dsCard group="UI Kit — Luminous Dashboard" name="UI Kit — Luminous Dashboard" subtitle="Click-thru recreation of the Luminous SaaS dashboard" viewport="1500x1100" -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1500">
  <title>Luminous Dashboard — UI Kit</title>
  <link rel="stylesheet" href="styles.css">

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <!-- We host icon assets relative to this file -->
  <script>
    // Patch Icon to look up icons relative to this kit folder.
    window.__lumIconBase = "../../assets/icons/";
  </script>

  <script type="text/babel" src="Primitives.jsx"></script>
  <script type="text/babel" src="Sidebar.jsx"></script>
  <script type="text/babel" src="SearchHeader.jsx"></script>
  <script type="text/babel" src="MetricCard.jsx"></script>
  <script type="text/babel" src="RevenueChartCard.jsx"></script>
  <script type="text/babel" src="ProfileCard.jsx"></script>
  <script type="text/babel" src="TasksCard.jsx"></script>
  <script type="text/babel" src="FloatingReportCard.jsx"></script>

  <script type="text/babel">
    function App() {
      const [active, setActive] = React.useState("dashboard");
      const user = { name: "Olivia Rhye", role: "Product Designer", initials: "OR" };

      return (
        <main className="lum-app" data-screen-label="01 Dashboard">
          <BackgroundDecor />
          <div className="lum-app__inner">
            <Sidebar active={active} onNavigate={setActive} />
            <div className="lum-main">
              <SearchHeader user={user} />
              <MetricGrid />
              <div className="lum-chartrow">
                <div className="lum-chartrow__main">
                  <RevenueChartCard />
                  <FloatingReportCard />
                </div>
                <aside className="lum-rightcol">
                  <ProfileCard />
                  <TasksCard />
                </aside>
              </div>
            </div>
          </div>
        </main>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
