<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="lum-tile" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C6DFF"></stop>
      <stop offset="55%" stop-color="#5B8CFF"></stop>
      <stop offset="100%" stop-color="#A78BFA"></stop>
    </linearGradient>
    <filter id="lum-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7C6DFF" flood-opacity="0.28"></feDropShadow>
    </filter>
  </defs>
  <rect x="0" y="0" width="48" height="48" rx="14" fill="url(#lum-tile)" filter="url(#lum-shadow)"></rect>
  <g transform="translate(24 24) rotate(45)">
    <rect x="-10" y="-10" width="20" height="20" rx="3" fill="rgba(255,255,255,0.20)" stroke="rgba(255,255,255,0.92)" stroke-width="2"></rect>
