<!doctype html>
<!-- @dsCard group="Components" name="Components — Avatars" subtitle="Gradient fallback, stack, +N" viewport="700x260" --><html><head><meta charset="utf-8"><title>Avatars</title><link rel="stylesheet" href="_card.css">
<style>.av{display:grid;place-items:center;border-radius:999px;border:1px solid rgba(255,255,255,0.85);background:var(--gradient-avatar);color:#fff;font:700 12px var(--font-sans);box-shadow:0 12px 26px rgba(91,140,255,0.25)}
.stack{display:flex}.stack .av{border:2px solid #fff}.stack .av+.av{margin-left:-8px}
.plus{display:inline-grid;place-items:center;height:32px;min-width:32px;padding:0 8px;border-radius:999px;background:#0F172A;color:#fff;font:700 10px var(--font-sans);border:2px solid #fff;margin-left:-8px}
</style></head>
<body><div class="card"><div class="col" style="gap:14px">
  <div class="label">Avatars — gradient fallback, 2-letter initials</div>
  <div class="row" style="gap:14px;align-items:flex-end">
    <div class="av" style="width:32px;height:32px;font-size:10px">OR</div>
    <div class="av" style="width:40px;height:40px;font-size:12px">OR</div>
    <div class="av" style="width:56px;height:56px;font-size:16px">OR</div>
    <div class="av" style="width:80px;height:80px;font-size:22px;border:4px solid rgba(255,255,255,0.7)">OR</div>
  </div>
  <div class="row" style="gap:0">
    <div class="stack">
      <div class="av" style="width:32px;height:32px;font-size:10px">MK</div>
      <div class="av" style="width:32px;height:32px;font-size:10px">AL</div>
      <div class="av" style="width:32px;height:32px;font-size:10px">JS</div>
    </div>
    <span class="plus">+3</span>
  </div>
</div></div></body></html>
