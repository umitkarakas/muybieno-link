<!doctype html>

<style>.tag{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700}

<body><div class="card"><div class="col" style="gap:14px">

<div class="label" style="margin-top:8px">Tag tones (paired bg + fg, used on task pills)</div>

  <span class="tag" style="background:#E0F2FE;color:#0369A1">Medium · sky</span>
