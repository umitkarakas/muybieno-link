<!doctype html>
<!-- @dsCard group="Colors" name="Colors — Brand accents" subtitle="Solid stops + gradient tiles" viewport="700x250" --><html><head><meta charset="utf-8"><title>Brand accents</title><link rel="stylesheet" href="_card.css">
<style>.swatch.violet{background:var(--gradient-tile-violet);}.swatch.sky{background:var(--gradient-tile-sky);}.swatch.vf{background:var(--gradient-tile-violet-fuchsia);}.swatch.peach{background:var(--gradient-tile-peach);}
.solid{display:flex;gap:10px}
.solid .s{width:54px;height:54px;border-radius:14px;display:flex;align-items:flex-end;padding:6px;color:#fff;font-size:9px;font-weight:700;box-shadow:var(--inset-top-edge),0 8px 18px rgba(15,23,42,0.08)}
</style></head>
<body><div class="card"><div class="col" style="gap:14px">
<div class="label">Brand accents — solid stops</div>
<div class="solid">
  <div class="s" style="background:#7C6DFF">7C6DFF</div>
  <div class="s" style="background:#5B8CFF">5B8CFF</div>
  <div class="s" style="background:#60A5FA">60A5FA</div>
  <div class="s" style="background:#A78BFA">A78BFA</div>
  <div class="s" style="background:#F0ABFC">F0ABFC</div>
  <div class="s" style="background:#FB923C">FB923C</div>
  <div class="s" style="background:#67E8F9;color:#0F172A">67E8F9</div>
</div>
<div class="label" style="margin-top:6px">Gradient tiles (icon containers)</div>
<div class="row" style="gap:14px">
  <div class="tile violet" style="background:var(--gradient-tile-violet);width:64px;height:64px"></div>
  <div class="tile sky" style="background:var(--gradient-tile-sky);width:64px;height:64px"></div>
  <div class="tile vf" style="background:var(--gradient-tile-violet-fuchsia);width:64px;height:64px"></div>
  <div class="tile peach" style="background:var(--gradient-tile-peach);width:64px;height:64px"></div>
  <div class="tile" style="background:var(--gradient-brand);width:64px;height:64px"></div>
</div>
</div></div></body></html>
