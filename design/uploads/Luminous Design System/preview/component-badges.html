<!doctype html>
<!-- @dsCard group="Components" name="Components — Badges & chips" subtitle="Tag pills, nav badge, ⌘K, dots" viewport="700x210" --><html><head><meta charset="utf-8"><title>Badges</title><link rel="stylesheet" href="_card.css">
<style>.b{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:0}
.nav-badge{display:inline-grid;place-items:center;height:24px;min-width:24px;padding:0 8px;border-radius:999px;background:#7C6DFF;color:#fff;font:700 12px var(--font-sans);box-shadow:var(--shadow-badge)}
.kbd{display:inline-flex;align-items:center;padding:6px 10px;border-radius:12px;border:1px solid rgba(255,255,255,0.7);background:rgba(255,255,255,0.65);box-shadow:inset 0 1px 0 rgba(255,255,255,.85);font:600 12px var(--font-sans);color:var(--color-fg-3)}
.dot{width:10px;height:10px;border-radius:999px;background:#A78BFA;border:2px solid #fff}
.dot.g{background:#22C55E}
</style></head>
<body><div class="card"><div class="col" style="gap:14px">
  <div class="label">Badges, pills, chips</div>
  <div class="row" style="gap:10px;flex-wrap:wrap">
    <span class="b" style="background:#FAE8FF;color:#A21CAF">High</span>
    <span class="b" style="background:#E0F2FE;color:#0369A1">Medium</span>
    <span class="b" style="background:#D1FAE5;color:#047857">Low</span>
    <span class="nav-badge">3</span>
    <span class="kbd">⌘ K</span>
  </div>
  <div class="row" style="gap:14px">
    <div class="row" style="gap:6px"><span class="dot"></span><span class="mono">notification dot</span></div>
    <div class="row" style="gap:6px"><span class="dot g"></span><span class="mono">presence dot</span></div>
  </div>
</div></div></body></html>
