<!doctype html>
<!-- @dsCard group="Components" name="Components — Search input" subtitle="Glass field with leading icon + ⌘K" viewport="700x180" --><html><head><meta charset="utf-8"><title>Search input</title><link rel="stylesheet" href="_card.css">
<style>.search{position:relative;height:56px;border-radius:24px;border:1px solid rgba(255,255,255,0.7);background:rgba(255,255,255,0.55);backdrop-filter:blur(40px);box-shadow:var(--shadow-search)}
.search input{width:100%;height:100%;background:transparent;border:0;outline:0;padding:0 96px 0 56px;font:500 14px var(--font-sans);color:var(--color-fg-1);border-radius:inherit}
.search input::placeholder{color:var(--color-fg-4)}
.search img{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:20px;height:20px;opacity:.65}
.search .kbd{position:absolute;right:14px;top:50%;transform:translateY(-50%);padding:6px 10px;border-radius:12px;border:1px solid rgba(255,255,255,0.7);background:rgba(255,255,255,0.65);box-shadow:inset 0 1px 0 rgba(255,255,255,.85);font:600 12px var(--font-sans);color:var(--color-fg-3)}
</style></head>
<body><div class="card"><div class="col" style="gap:10px">
  <div class="label">Search input — full-width glass with leading icon + ⌘K hint</div>
  <div class="search">
    <img src="../assets/icons/search.svg" alt="">
    <input placeholder="Search anything..." />
    <span class="kbd">⌘ K</span>
  </div>
</div></div></body></html>
