<!-- @dsCard group="Storefront" viewport="1280x820" name="Storefront — Homepage" -->
<!-- @startingPoint section="Storefront" subtitle="Muybieno homepage — hero, categories, featured coffees" viewport="1280x900" -->
<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muybieno — Mağaza</title>
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin:0; background:var(--surface); }
  #toast { position:fixed; left:50%; top:18px; transform:translateX(-50%); z-index:200; display:none; align-items:center; gap:10px; padding:13px 20px; border-radius:14px; background:var(--surface-inverse); color:var(--cream-100); font-family:var(--font-sans); font-size:14px; font-weight:600; box-shadow:0 18px 40px rgba(39,19,16,0.34); }
</style>
</head>
<body>
<div id="toast"></div>
<div id="root"></div>
<script type="text/babel">
  const NS = window.Muybieno || (function () {
    for (const k of Object.keys(window)) {
      const v = window[k];
      if (v && typeof v === 'object' && v.Storefront) return v;
    }
    return {};
  })();
  const { Storefront } = NS;

  let count = 0;
  function bump(p) {
    count += 1;
    const t = document.getElementById('toast');
    t.textContent = (p && p.name ? p.name : 'Ürün') + ' sepete eklendi';
    t.style.display = 'flex';
    clearTimeout(window.__tt);
    window.__tt = setTimeout(() => { t.style.display = 'none'; }, 2000);
    render();
  }
  function render() {
    ReactDOM.createRoot(document.getElementById('root')).render(
      <Storefront cartCount={count} onAdd={bump} />
    );
  }
  // single root
  const root = ReactDOM.createRoot(document.getElementById('root'));
  function paint() { root.render(<Storefront cartCount={count} onAdd={bump} />); }
  window.__paint = paint;
  // override render to reuse root
  render = paint;
  paint();
</script>
</body>
</html>
